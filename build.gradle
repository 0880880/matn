buildscript {
    repositories {
        maven { url 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
        google()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
    dependencies {
        classpath "com.badlogicgames.jnigen:jnigen-gradle:$jniGenVersion"
    }
}

plugins {
    id 'java'
}

apply plugin: "com.badlogicgames.jnigen.jnigen-gradle"

group 'com.github.zeroeighteightzero.matn'
version '0.3.0'

repositories {
    maven { url 'https://jitpack.io' }
    maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "com.github.tommyettinger:regexodus:$regexodusVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.jnigen:jnigen-loader:$jniGenVersion"
    implementation "com.badlogicgames.jnigen:jnigen-runtime:$jniGenVersion"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-desktop"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-ios"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-x86"
    implementation "com.badlogicgames.jnigen:jnigen-runtime-platform:$jniGenVersion:natives-x86_64"

    testImplementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly(files("build/jnigen/libs/matn-natives-desktop.jar"))
}

java {
    withJavadocJar()
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

task dist(type: Jar) {
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
}

tasks.withType(JavaCompile) {
    if (JavaVersion.current().isJava9Compatible()) {
        options.compilerArgs += ["--release", "8"]
    }
}

tasks.register('fontViewer', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.zeroeighteightzero.matn.FontViewer'
}

jnigen {
    sharedLibName = "matn"

    generator {
        outputPath = file("src/main/java")
        basePackage = "com.github.zeroeighteightzero.matn._native"
        fileToParse = "matn.h"
        options = [
                "-Ijni/matn/include",
                "-Ijni/harfbuzz/src",
                "-Ijni/harfbuzz-config",
        ]
    }

    all {
        headerDirs += [
                "jni/harfbuzz-config",
                "jni/msdfgen-config",
                "jni/harfbuzz/src",
                "jni/matn/include",
                "jni/msdfgen",
                "jni/msdfgen/core",
        ]

        cIncludes = [
                ""
        ]

        cppIncludes = [
                "jni/harfbuzz/src/harfbuzz-world.cc",
                "jni/msdfgen/core/Contour.cpp",
                "jni/msdfgen/core/contour-combiners.cpp",
                "jni/msdfgen/core/convergent-curve-ordering.cpp",
                "jni/msdfgen/core/DistanceMapping.cpp",
                "jni/msdfgen/core/edge-coloring.cpp",
                "jni/msdfgen/core/edge-segments.cpp",
                "jni/msdfgen/core/edge-selectors.cpp",
                "jni/msdfgen/core/EdgeHolder.cpp",
                "jni/msdfgen/core/equation-solver.cpp",
                "jni/msdfgen/core/msdf-error-correction.cpp",
                "jni/msdfgen/core/MSDFErrorCorrection.cpp",
                "jni/msdfgen/core/msdfgen.cpp",
                "jni/msdfgen/core/Projection.cpp",
                "jni/msdfgen/core/rasterization.cpp",
                "jni/msdfgen/core/render-sdf.cpp",
                "jni/msdfgen/core/Scanline.cpp",
                "jni/msdfgen/core/sdf-error-estimation.cpp",
                "jni/msdfgen/core/Shape.cpp",
                "jni/msdfgen/core/shape-description.cpp",
                "jni/matn/src/matn.cpp"
        ]

        cExcludes = [
                "jni/harfbuzz/subprojects/",
        ]

        cppExcludes = [
                "jni/harfbuzz/subprojects/",
        ]

        cFlags += ["-DHAVE_CONFIG_H", "-fvisibility=hidden", "-DSB_CONFIG_UNITY"]
        cppFlags += ["-DHAVE_CONFIG_H", "-std=c++14", "-fno-threadsafe-statics", "-fvisibility-inlines-hidden", "-fvisibility=hidden"]
    }

    addWindows(x32, x86, GCC_CLANG)
    addWindows(x64, x86, GCC_CLANG)

    addLinux(x64, x86)
    addLinux(x32, ARM)
    addLinux(x64, ARM)
    addLinux(x64, RISCV)

    addMac(x64, x86)
    addMac(x64, ARM)
    addIOS()

    robovm {
        minIOSVersion = "15.0"
    }

    addAndroid() {
        androidApplicationMk += ["APP_CPPFLAGS += -fexceptions -frtti\nAPP_STL := c++_shared"]
        cppFlags += ["-fexceptions"]
    }
}

apply from: 'publish.gradle'
